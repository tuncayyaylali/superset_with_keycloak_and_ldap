apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-redis
  namespace: superset-bi
  labels:
    app: superset-redis
    app.kubernetes.io/component: superset-redis
    app.kubernetes.io/part-of: bi-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: superset-redis
  template:
    metadata:
      labels:
        app: superset-redis
        app.kubernetes.io/component: superset-redis
        app.kubernetes.io/part-of: bi-platform
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

