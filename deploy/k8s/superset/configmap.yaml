apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: superset-bi
  labels:
    app.kubernetes.io/component: superset
    app.kubernetes.io/part-of: bi-platform
data:
  custom_sso_security_manager.py: |
    import logging
    import jwt
    from flask_appbuilder.security.views import AuthOAuthView
    from superset.security import SupersetSecurityManager

    logger = logging.getLogger(__name__)

    # Monkey-patch Authlib OpenIDMixin.parse_id_token to accept both frontend (localhost:8080)
    # and cluster-internal (keycloak.superset-bi.svc.cluster.local:8080) Keycloak issuer claims.
    try:
        from authlib.integrations.base_client.sync_openid import OpenIDMixin

        orig_parse_id_token = OpenIDMixin.parse_id_token

        def permissive_parse_id_token(self, token, nonce, claims_options=None, leeway=120):
            if claims_options is None:
                claims_options = {
                    "iss": {
                        "values": [
                            "http://localhost:8080/realms/analytics-realm",
                            "http://127.0.0.1:8080/realms/analytics-realm",
                            "http://keycloak.superset-bi.svc.cluster.local:8080/realms/analytics-realm",
                        ]
                    }
                }
            return orig_parse_id_token(
                self, token, nonce, claims_options=claims_options, leeway=leeway
            )

        OpenIDMixin.parse_id_token = permissive_parse_id_token
        logger.info(
            "[CustomSsoSecurityManager] Successfully patched OpenIDMixin.parse_id_token for multi-origin OIDC issuer validation."
        )
    except Exception as e:
        logger.warning(f"[CustomSsoSecurityManager] Could not patch OpenIDMixin: {e}")

    GROUP_ROLE_MAPPING = {
        "bi-admins": ["Admin"],
        "bi-analysts": ["Alpha"],
        "bi-finance-viewers": ["Gamma", "Finance_Viewers"],
        "bi-sales-viewers": ["Gamma", "Sales_Viewers"]
    }

    class CustomSsoSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
            if provider == "keycloak":
                token = response.get("access_token") if response else None
                id_token = response.get("id_token") if response else None

                claims = {}
                for raw_token in [id_token, token]:
                    if raw_token:
                        try:
                            decoded = jwt.decode(
                                raw_token,
                                options={"verify_signature": False},
                                algorithms=["RS256"]
                            )
                            claims.update(decoded)
                        except Exception as e:
                            logger.warning(f"Error decoding JWT token from {provider}: {e}")

                username = (
                    claims.get("preferred_username")
                    or claims.get("sub")
                    or claims.get("email")
                )
                email = claims.get("email") or f"{username}@example.org"
                first_name = claims.get("given_name") or username
                last_name = claims.get("family_name") or "User"
                groups = claims.get("groups", [])

                if isinstance(groups, str):
                    groups = [groups]

                logger.info(
                    f"[CustomSsoSecurityManager] User: {username}, Email: {email}, Groups: {groups}"
                )

                return {
                    "username": username,
                    "email": email,
                    "first_name": first_name,
                    "last_name": last_name,
                    "groups": groups,
                }

            return super().oauth_user_info(provider, response)

        def auth_user_oauth(self, userinfo):
            user = super().auth_user_oauth(userinfo)
            if not user:
                return None

            groups = userinfo.get("groups", [])
            roles_to_assign = set()

            for group in groups:
                mapped_roles = GROUP_ROLE_MAPPING.get(group)
                if mapped_roles:
                    for role_name in mapped_roles:
                        roles_to_assign.add(role_name)

            if not roles_to_assign:
                default_role = self.auth_user_registration_role or "Public"
                roles_to_assign.add(default_role)

            is_viewer = any("viewers" in g for g in groups)
            is_privileged = any(g in ["bi-admins", "bi-analysts"] for g in groups)

            if is_viewer and not is_privileged:
                roles_to_assign.discard("Admin")
                roles_to_assign.discard("Alpha")

            user_roles = []
            for role_name in sorted(roles_to_assign):
                role = self.find_role(role_name)
                if not role:
                    logger.info(f"Role '{role_name}' not found. Creating custom role.")
                    role = self.add_role(role_name)
                if role:
                    user_roles.append(role)

            user.roles = user_roles
            self.get_session.commit()

            logger.info(
                f"[CustomSsoSecurityManager] Updated roles for '{user.username}': {[r.name for r in user_roles]}"
            )

            return user

  superset_config.py: |
    import os
    import logging
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from custom_sso_security_manager import CustomSsoSecurityManager

    logger = logging.getLogger(__name__)

    SECRET_KEY = os.environ.get(
        "SUPERSET_SECRET_KEY", "superset-secret-key-change-in-production-12345"
    )
    SUPERSET_WEBSERVER_TIMEOUT = 120
    ROW_LIMIT = 5000
    ENABLE_PROXY_FIX = True

    DB_USER = os.environ.get("POSTGRES_USER", "superset")
    DB_PASS = os.environ.get("POSTGRES_PASSWORD", "supersetpassword")
    DB_HOST = os.environ.get("POSTGRES_HOST", "superset-db.superset-bi.svc.cluster.local")
    DB_PORT = os.environ.get("POSTGRES_PORT", "5432")
    DB_NAME = os.environ.get("POSTGRES_DB", "superset")

    SQLALCHEMY_DATABASE_URI = (
        f"postgresql+psycopg2://{DB_USER}:{DB_PASS}@{DB_HOST}:{DB_PORT}/{DB_NAME}"
    )

    REDIS_HOST = os.environ.get("REDIS_HOST", "superset-redis.superset-bi.svc.cluster.local")
    REDIS_PORT = os.environ.get("REDIS_PORT", "6379")

    CACHE_CONFIG = {
        "CACHE_TYPE": "RedisCache",
        "CACHE_DEFAULT_TIMEOUT": 300,
        "CACHE_KEY_PREFIX": "superset_cache_",
        "CACHE_REDIS_URL": f"redis://{REDIS_HOST}:{REDIS_PORT}/0",
    }
    DATA_CACHE_CONFIG = CACHE_CONFIG
    FILTER_STATE_CACHE_CONFIG = CACHE_CONFIG
    EXPLORE_FORM_DATA_CACHE_CONFIG = CACHE_CONFIG

    class CeleryConfig:
        broker_url = f"redis://{REDIS_HOST}:{REDIS_PORT}/1"
        imports = ("superset.sql_lab",)
        result_backend = f"redis://{REDIS_HOST}:{REDIS_PORT}/2"
        worker_prefetch_multiplier = 10
        task_acks_late = True

    CELERY_CONFIG = CeleryConfig

    FEATURE_FLAGS = {
        "DASHBOARD_RBAC": True,
        "ENABLE_TEMPLATE_PROCESSING": True,
    }

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Public"
    CUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager
    LOGOUT_REDIRECT_URL = os.environ.get(
        "LOGOUT_REDIRECT_URL",
        "http://localhost:8080/realms/analytics-realm/protocol/openid-connect/logout?post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A8088%2Flogin%2F&client_id=superset",
    )

    KEYCLOAK_INTERNAL_BASE = os.environ.get(
        "KEYCLOAK_INTERNAL_BASE",
        "http://keycloak.superset-bi.svc.cluster.local:8080/realms/analytics-realm",
    )
    KEYCLOAK_FRONTEND_AUTH_URL = os.environ.get(
        "KEYCLOAK_FRONTEND_AUTH_URL",
        "http://localhost:8080/realms/analytics-realm/protocol/openid-connect/auth",
    )

    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": os.environ.get("SUPERSET_OIDC_CLIENT_ID", "superset"),
                "client_secret": os.environ.get(
                    "SUPERSET_OIDC_CLIENT_SECRET", "superset-client-secret-12345"
                ),
                "client_kwargs": {
                    "scope": "openid email profile"
                },
                "server_metadata_url": f"{KEYCLOAK_INTERNAL_BASE}/.well-known/openid-configuration",
                "api_base_url": f"{KEYCLOAK_INTERNAL_BASE}/protocol/openid-connect/",
                "access_token_url": f"{KEYCLOAK_INTERNAL_BASE}/protocol/openid-connect/token",
                "authorize_url": KEYCLOAK_FRONTEND_AUTH_URL,
            },
        }
    ]

